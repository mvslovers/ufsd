[project]
name = "ufsd"
version = "1.1.0-dev"
type = "application"

[build]
# -DVERSION feeds ufsd.c's `#ifndef VERSION` (otherwise the hardcoded
# fallback). v1's mbt injected it automatically; v2 does not.
#
# -DCOMMIT / -DCOMMIT_DIRTY are the build stamp behind UFSD000I/UFSD006W.
# "-dirty" counts TRACKED modifications only (--untracked-files=no): stray
# notes and generated files are not a provenance difference. Outside a git
# checkout -- a source tarball -- the hash degrades to "unknown" rather
# than failing the build.
#
# Caveat: both are baked into ufsd.o, which mbt recompiles only when
# ufsd.c or one of its headers changes, so a local incremental build made
# after a commit can still carry the previous hash. Release and CI builds
# start from a clean tree, so a packaged banner is always accurate; `make
# clean` restores it locally. The general fix belongs in mbt.mk.
cflags = [
    "-I", "include",
    '-DVERSION=\"$(PROJECT_VERSION)\"',
    '-DCOMMIT=\"$(shell git rev-parse --short HEAD 2>/dev/null || echo unknown)$(shell git status --porcelain --untracked-files=no 2>/dev/null | grep -q . && echo -dirty)\"',
    '-DCOMMIT_DIRTY=$(shell git status --porcelain --untracked-files=no 2>/dev/null | grep -q . && echo 1 || echo 0)',
]

# ── Load modules ─────────────────────────────────────────
# UFSD — main daemon (threading → crt1)
[[module]]
name = "UFSD"
startup = "crt1"
ac = 1
sources = ["src/ufsd*.c"]
exclude = ["src/ufsdclnp.c", "src/ufsd#ssi.c"]

# UFSDSSIR — SSI thin router (loaded into CSA, no CRT)
[[module]]
name = "UFSDSSIR"
entry = "UFSDSSIR"
startup = false
ac = 1
sources = ["src/ufsd#ssi.c", "src/ufsd#buf.c"]

# UFSDCLNP — cleanup utility (all defaults: entry=@@CRT0, startup=crt0)
# Wraps the shared reclaim routine (ufsd#rcl.c, also part of UFSD).
[[module]]
name = "UFSDCLNP"
ac = 1
sources = ["src/ufsdclnp.c", "src/ufsd#rcl.c"]

# UFSFMT — disk format utility (batch, unauthorized: plain BSAM/BDAM I/O)
[[module]]
name = "UFSFMT"
ac = 0
sources = ["src/ufsfmt.c", "src/ufsfmtg.c"]

# ── Tests ────────────────────────────────────────────────
[[test]]
name = "LIBUFTST"
host = false          # MVS-only: drives the server through the SSI
sources = ["client/libufstst.c", "client/libufs.c"]

# TSTUFSG — UFSFMT geometry: the counters #50 fixes. Portable C, so it
# runs natively via `make test-host` as well as on the target.
[[test]]
name = "TSTUFSG"
sources = ["test/mvs/tstufsg.c", "src/ufsfmtg.c"]

# ── Library (consumed by HTTPD and others) ───────────────
[lib]
name = "libufs"
sources = ["client/libufs.c"]
headers = ["include/libufs.h", "include/ufsdrc.h"]

# ── Release ──────────────────────────────────────────────
[release]
version_files = ["VERSION"]
