schema = 3

[project]
name = "ufsd"
version = "1.5.0-dev"
kind = "application"

[toolchain]
# mbt: the mbt 3 release line this project is built with; a newer installed
# mbt switches to a matching 3.0.x by itself.
#
# cc370 and libc370 pin what release.yml (mbt's release3.yml) builds the
# published artifacts against; build.yml deliberately keeps floating on main
# so a cc370/libc370 regression surfaces in a PR build (mbt#68).
# 2.3.1: the C runtime startup is a member of libc.a from 2.3.0 on,
# so no module names a startup object (mvslovers/mbt#158). An older libc.a
# would quietly link crt0 where these modules used to have crt1. 2.3.1
# rather than 2.3.0 for the subtask cleanup fix (mvslovers/libc370#431).
# 2.4.0 needs cc370 >= 1.4.0 and ships no crt0.o/crt1.o; mbt 2.2.0 needs
# neither.
# 2.6.1: a drop-in for 2.4.0 here. Since 2.5.0 stdio skips the stream's
# ENQ while the program has no threads; ufsd creates none, so nothing it
# serialized loses its lock.
# 2.10.3: a failed write no longer STOWs the member on close
# (mvslovers/libc370#524). 2.6.2 to 2.10.2 change nothing ufsd calls
# (fseek/ftell, rand, VSAM, __listds, the COBOL entry); the IBM macros
# come from maclib370 since 2.8.0.
# 2.23.0: 2.10.3 to 2.23.0 change no prototype ufsd calls; the build and
# the 191 host assertions are identical against both. What does differ:
# iefssreq() refuses an unauthorized caller with -1/EPERM instead of S047
# and no longer drops a supervisor-state caller to problem state
# (mvslovers/libc370#402; libufs is its only caller here); the standard
# streams, SYSENV and TZ are set up on first use (#564); stdin was already
# the (*__gtin()) macro in 2.10.3. UFSFMT in a throwaway container gives the
# same SYSPRINT and CC 0 with SYSIN data, no SYSIN DD and SYSIN DD DUMMY, and
# the same SYSTERM and CC 8 on its error paths; only an unused SYSTERM is no
# longer spooled as an empty data set. getmain/freemain/__estae/
# __crtget no longer link printf and stdio (#283, #564), which shrinks
# UFSDSSIR (CSA) from 0xB840 to 0x6B10 bytes and UFSDCLNP from 0x13C10 to
# 0xA978. No member linked into UFSD, UFSDCLNP or UFSDSSIR gains writable
# data (constraint 7); checked by hand, as for #64, since the module-data
# checkers do not read libc members.
# cc370: libc370 2.8.0 and later need cc370 >= 1.6.0 (every header
# #errors below it); 1.6.1 satisfies 2.23.0.
cc370 = "1.6.1"
libc370 = "2.23.0"
mbt = "3.0"

# ── Load modules ─────────────────────────────────────────
# UFSD — main daemon
[module.UFSD]
rent = true
reus = true
ac = 1
sources = ["src/ufsd*.c"]
exclude = ["src/ufsdclnp.c", "src/ufsd#ssi.c"]

# UFSDSSIR — SSI thin router (loaded into CSA, no CRT)
[module.UFSDSSIR]
rent = true
reus = true
entry = "UFSDSSIR"
startup = false
ac = 1
sources = ["src/ufsd#ssi.c", "src/ufsd#buf.c"]

# UFSDCLNP — cleanup utility (all defaults: entry=@@CRT0)
# Wraps the shared reclaim routine (ufsd#rcl.c, also part of UFSD).
[module.UFSDCLNP]
rent = true
reus = true
ac = 1
sources = ["src/ufsdclnp.c", "src/ufsd#rcl.c", "src/ufsd#asv.c"]

# UFSFMT — disk format utility (batch, unauthorized: plain BSAM/BDAM I/O)
[module.UFSFMT]
rent = false          # s_quiet is written (SYSIN QUIET), set before first use on every run
reus = true
ac = 0
sources = ["src/ufsfmt.c", "src/ufsfmtg.c"]

# ── Tests ────────────────────────────────────────────────
# Defaults for every test; test/**/*.c and *.asm are tests unless excluded.
[tests]
rent = false
reus = false

[test.LIBUFTST]
rent = true
reus = true
host = false                                        # MVS-only: drives the server through the SSI
sources = ["client/libufstst.c", "client/libufs.c"]

# TSTUFSG — UFSFMT geometry: the counters #50 fixes. Portable C, so it
# runs natively via `mbt test` as well as on the target.
[test.TSTUFSG]
rent = false          # mbtcheck.h keeps file-static counters
sources = ["test/mvs/tstufsg.c", "src/ufsfmtg.c"]

# TSTUFSAV — the ASVT scan behind the #53 liveness guard. Portable C,
# so it runs natively via `mbt test` as well as on the target.
[test.TSTUFSAV]
rent = false          # mbtcheck.h keeps file-static counters
sources = ["test/mvs/tstufsav.c", "src/ufsd#asv.c"]

# TSTUFSMP — the mount point table do_dirread crosses a mount with (#52).
# Portable C, so it runs natively via `mbt test` as well as on the
# target.
[test.TSTUFSMP]
rent = false          # mbtcheck.h keeps file-static counters
sources = ["test/mvs/tstufsmp.c", "src/ufsd#mnt.c"]

# TSTLIBUF — client/libufs.c on the host, with a stub standing in for the one
# call it makes into MVS: iefssreq() (SVC 34). The stub is defined in the test,
# so libufs.c is compiled unchanged; test/host/include holds the few libc370 /
# IBM headers it needs, as type-only stand-ins. Host-only (mvs = false):
# LIBUFTST is the test that runs libufs against a live server.
[test.TSTLIBUF]
rent = false          # mbtcheck.h keeps file-static counters
mvs = false           # needs the stand-in headers and its own iefssreq
sources = ["test/host/tstlibuf.c", "client/libufs.c"]

# TSTUFSRC — the same guard on real control blocks (CVT/ASVT/PSA), which
# only the target has. Reads storage; registers nothing.
[test.TSTUFSRC]
rent = false          # mbtcheck.h keeps file-static counters
host = false                                                          # MVS-only: needs a live ASVT
sources = ["test/mvs/tstufsrc.c", "src/ufsd#rcl.c", "src/ufsd#asv.c"]

# TSTUFSIO — the ferror() guards behind UFSD106E and UFSFMT17E (#69): a read
# error on DD:UFSDPRM / SYSIN must stop ufsd_cfg_read() and parse_sysin(), not
# pass for end of file. Builds its own data sets (a wrong-length block) with
# SVC 99 and BSAM, so it needs no fixture. Includes src/ufsfmt.c whole to reach
# the static parse_sysin().
[test.TSTUFSIO]
rent = false          # mbtcheck.h keeps file-static counters
host = false                                                          # MVS-only: SVC 99, BSAM
sources = ["test/mvs/tstufsio.c", "src/ufsd#cfg.c", "src/ufsfmtg.c"]

# The host compiler has no libc370 or IBM macro headers; test/host/include has
# type-only stand-ins for the ones libufs.c reads. -Dasm(x)= drops the
# asm("UFS#...") external names libufs.h puts on its prototypes: they are MVS
# member names and the host assembler cannot take them.
[build.host]
cflags = ["-Dasm(x)=", "-I", "test/host/include"]

# ── Library (consumed by HTTPD and others) ───────────────
[lib]
name = "libufs"
sources = ["client/libufs.c"]
headers = ["include/libufs.h", "include/ufsdrc.h"]

# ── Distribution (SMP4 install package) ──────────────────
# Turns `mbt package` into an installable product. Two transports, on purpose:
#
#   load modules  -> XMIT -> staging LKLIB -> SMP ++MOD -> UFSD.LINKLIB
#   samplib/      -> XMIT -> TSO RECEIVE   -> UFSD.SAMPLIB
#
# SMP *copies* the host-bound modules rather than re-binding them (a COPY-style
# ++JCLIN is what says so), which is what keeps ac = 1 and the entry points
# exactly as ld370 set them. The sample library stays outside SMP: an MCS card
# ends at column 72, and a configuration pattern should not have to answer to a
# delivery mechanism. The install job's DELOLD step scratches and re-receives
# it whole every time, so there is still no in-place update for SMP to manage.
#
# Every value is a dataset name; the ddname SMP addresses it by is always the
# last qualifier, so LINKLIB, SAMPLIB and AUFSDLOD fall out of the names.
#
# None of them carries a version qualifier, and @VRM@ is deliberately unused
# here (#71). A versioned target library is a name the site has to re-type
# every release: the STC procedure's STEPLIB, any client's JCL, and -- the one
# that hurts -- the APF list in SYS1.PARMLIB(IEAAPF00), which MVS 3.8j reads
# only at IPL. Versioned, that is one IPL per release; stable, one IPL ever.
# On a system without RAKF (no SVC 244 to authorize from) the APF route is the
# only way UFSD starts at all, so this is not a convenience.
#
# What the version qualifier looked like it bought was a clean cut between
# minors, and it did not: SMP keys element ownership on MOD(UFSD) in the CDS,
# not on the library the element lives in. A new FMID does not replace an
# element it does not own no matter which dataset that element sits in -- it
# reports NOT SEL and copies nothing, at RC 0, with every condition code
# reading success. The UCLIN in docs/uninstall.md is required either way. What
# it did cost was a V1R2M0-for-all-of-1.2.x ambiguity that scratched the wrong
# libraries once already (ftpd, 2026-09-05).
#
# Two consequences to keep in the install guide:
#   - the alloc job runs once EVER, not once per release. A second run fails
#     on DISP=(NEW,CATLG) and changes nothing; an upgrade skips it.
#   - there is no side-by-side install and no back-out by dataset. The way
#     back is SMP RESTORE from the DLIB, which is what accept_fmid below
#     exists for.
[distribution]
readme = "docs/installation.md"

[smp]
# One FMID per minor release: T + three product letters + major + minor + 0,
# so every 1.5.x is TUFS150. Each id is spent exactly once, and each release
# deletes the one before it -- that is what `prefix` below derives. A patch is
# meant to become a PTF against its minor's FMID once mbt builds PTFs; until
# then a patch release needs an explicit `fmid` of its own (1.5.1 as TUFS151),
# and the next minor an explicit `delete` naming that id. No version component
# may ever exceed 9: a 7-character id has no room for a second digit, so at
# patch 9 the next release is a new minor. ufsd 1.3.10 cannot be expressed and
# must not be released.
#
# The id space skips, and that is deliberate: 1.2.0 through 1.2.2 all shipped
# under TUFS120, so TUFS121 and TUFS122 are never assigned. Do not fill a gap.
#
# The delete is the whole upgrade story. SMP keys element ownership on MOD(name)
# in the CDS, not on the library the element lives in, so without it a
# successor cannot install at all: it reports NOT SEL for every module, copies
# nothing, and still ends RC 00 with an empty target library. With it, SMP
# deletes the predecessor's LMODs (HMA2240) and copies the new ones in
# (HMA2380), and MOD(x) comes back carrying the new FMID. Measured on mvsdev
# 2026-09-14. The UCLIN in docs/uninstall.md is for *removing* UFSD now, not
# for upgrading it.
#
# The T keeps clear of IBM's FMID namespace, which on MVS 3.8j is E??nnnn
# (EBB1102 is MVS itself). Never TMVS... or another name MVS/CE and TK5
# already use for applied usermods (TMVS804, TJES801, TNIP800, ...). A test
# install needs a throwaway id *and* throwaway module names -- a throwaway id
# alone just measures the ownership wall above.
prefix = "TUFS"  # FMID and delete follow from the version
prereq = []                     # no [dependencies]; RAKF is a *runtime* one
accept_fmid = true              # accept the FMID once so a PTF can be RESTOREd
lklib = "UFSD.UFSDLOAD"         # staging: what the load XMIT is received into
target = "UFSD.LINKLIB"         # where the load modules end up

[distribution.library.samplib]
target = "UFSD.SAMPLIB"
